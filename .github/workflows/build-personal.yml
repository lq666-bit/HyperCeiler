# 个人精简版构建工作流
# - 只构建 Debug APK(走 debug 签名)
# - APK 内代码完整保留,但运行时只加载状态栏相关 Hook(由 XposedInitEntry.java 中的过滤逻辑保证)
# - 需要 GitHub Secrets: GPR_USER(lq666-bit)、GPR_KEY(带 read:packages 的 PAT)
# - 触发方式:push 到 main 分支 或 手动触发
name: Build Personal (StatusBar Only)

on:
  workflow_dispatch: # 手动触发(在 GitHub 网页点 "Run workflow")
  push:
    branches: [main]
    paths:
      - 'library/libhook/src/main/java/com/sevtinge/hyperceiler/libhook/base/XposedInitEntry.java'
      - '.github/workflows/build-personal.yml'

jobs:
  build_app:
    runs-on: macos-latest
    name: 构建 Debug APK (状态栏专用)
    steps:
      - name: 拉取代码(完整 git 历史用于版本号生成)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: 安装 JDK 25(项目要求 JDK 25)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: 配置 Gradle(加速后续构建)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true

      - name: 创建 signing.properties(GPR 凭据从 Secrets 读取)
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: |
          echo "gpr.user=${GPR_USER}" >> signing.properties
          echo "gpr.key=${GPR_KEY}" >> signing.properties
          echo "(signing.properties 内容已生成)"

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug

      - name: 重命名 APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          mv "$APK_PATH" "app/build/outputs/apk/debug/HyperCeiler-Personal.apk"

      - name: 上传 APK 到 Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HyperCeiler-Personal-StatusBar
          path: app/build/outputs/apk/debug/HyperCeiler-Personal.apk
          if-no-files-found: error
          compression-level: 9
